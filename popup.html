<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Resume Job Matcher</title>
  <style>
    body {
      width: 360px;
      font-family: system-ui, sans-serif;
      padding: 12px;
      background: #1e1e1e;
      color: #eee;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    textarea {
      width: 100%;
      height: 140px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 12px;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #eee;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4f7cff;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-top: 6px;
      min-height: 16px;
    }
    #results {
      margin-top: 10px;
    }
    .job-card {
      background: #2a2a2a;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .job-title {
      font-size: 13px;
      font-weight: 600;
    }
    .job-company {
      font-size: 12px;
      color: #aaa;
    }
    .job-link {
      font-size: 12px;
      color: #7ea6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>Resume Job Matcher</h2>
  <textarea id="resumeInput" placeholder="Paste your resume text here..."></textarea>
  <button id="analyzeBtn">Find Matching Jobs</button>
  <div id="status"></div>
  <div id="results"></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
